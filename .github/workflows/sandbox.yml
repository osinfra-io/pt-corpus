name: Sandbox

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - "**.md"

concurrency:
  group: sandbox-${{ github.head_ref }}
  cancel-in-progress: false

# For reusable workflows, the permissions setting for id-token should be set to write at the
# caller workflow level or in the specific job that calls the reusable workflow.

permissions:
  contents: read
  id-token: write

jobs:
  main:
    name: "Main"
    uses: osinfra-io/pt-techne-opentofu-workflows/.github/workflows/plan-and-apply.yml@66e04fe1c5a017238caf7be3d544a0a66b918dd1 # v0.5.5
    if: github.actor != 'dependabot[bot]'
    with:
      checkout_ref: ${{ github.ref }}
      github_environment: "Sandbox: Main"
      service_account: pt-corpus-github@pt-corpus-tfc9-sb.iam.gserviceaccount.com
      opentofu_kms_encryption_key: projects/pt-corpus-tfc9-sb/locations/us/keyRings/state-encryption/cryptoKeys/default
      opentofu_plan_args: -var-file=environments/sandbox.tfvars
      opentofu_state_bucket: pt-corpus-state-sb
      opentofu_version: ${{ vars.OPENTOFU_VERSION }}
      opentofu_workspace: main-sandbox
      workload_identity_provider: projects/190688376851/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc
    secrets:
      opentofu_plan_secret_args: >-
        -var=datadog_api_key=${{ secrets.DATADOG_API_KEY }}
        -var=datadog_app_key=${{ secrets.DATADOG_APP_KEY }}

  regional:
    name: "Regional: ${{ matrix.region }}"
    uses: osinfra-io/pt-techne-opentofu-workflows/.github/workflows/plan-and-apply.yml@66e04fe1c5a017238caf7be3d544a0a66b918dd1 # v0.5.5
    if: github.actor != 'dependabot[bot]'
    needs: main
    strategy:
      matrix:
        include:
          - region: us-east1
          - region: us-east4
    with:
      checkout_ref: ${{ github.ref }}
      github_environment: "Sandbox: Regional - ${{ matrix.region }}"
      service_account: pt-corpus-github@pt-corpus-tfc9-sb.iam.gserviceaccount.com
      opentofu_kms_encryption_key: projects/pt-corpus-tfc9-sb/locations/us/keyRings/state-encryption/cryptoKeys/default
      opentofu_plan_args: -var-file=environments/${{ matrix.region }}-sandbox.tfvars
      opentofu_state_bucket: pt-corpus-state-sb
      opentofu_version: ${{ vars.OPENTOFU_VERSION }}
      opentofu_workspace: ${{ matrix.region }}-sandbox
      working_directory: regional
      workload_identity_provider: projects/190688376851/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc
